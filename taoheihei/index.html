<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>胖蛋军团 · 坠猩杯档案馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* 粉蓝渐变边框容器（与主理人选择界面一致） */
        .frame {
            background: linear-gradient(135deg, #ffb6c1, #87cefa);
            border-radius: 40px;
            padding: 16px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
        }

        /* 内部白色内容区 */
        .white-bg {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem;
            text-align: center;
        }

        h2 {
            color: #ff6699;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .subhead {
            color: #ffb6c1;
            margin-bottom: 2rem;
        }

        /* 分组标题 */
        .team-title {
            font-size: 1.5rem;
            color: #ff6699;
            border-left: 5px solid #ffb6c1;
            padding-left: 1rem;
            text-align: left;
            margin: 1.5rem 0 1rem 0;
        }

        /* 成员网格 */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* 卡片样式（与主理人卡片一致） */
        .player-card {
            background: #f8f9fc;
            border-radius: 2rem;
            padding: 1.2rem;
            text-align: center;
            transition: 0.25s;
            cursor: pointer;
            border: 1px solid #e0e6f0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        }

        .player-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1);
            border-color: #ffb6c1;
        }

        /* 头像图片样式（圆形） */
        .avatar-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 0.8rem;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            background: #fff0f5;
        }

        /* 如果图片未加载，显示后备文字或emoji（可选） */
        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff6699;
            margin: 0.5rem 0 0;
        }

        /* 返回按钮 */
        .back-home {
            display: inline-block;
            margin-top: 1rem;
            background: none;
            border: 1px solid #ffb6c1;
            color: #ff6699;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-home:hover {
            background: #ffb6c1;
            color: white;
            border-color: #ffb6c1;
        }

        @media (max-width: 700px) {
            .white-bg { padding: 1rem; }
            .player-card { padding: 0.8rem; }
            .avatar-img { width: 80px; height: 80px; }
            .player-name { font-size: 1rem; }
            h2 { font-size: 1.5rem; }
            .team-title { font-size: 1.2rem; }
        }
    </style>
</head>
