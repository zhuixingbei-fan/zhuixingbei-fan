<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>选择你的阵营 · 坠猩杯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;  /* 最外层背景，不影响边框效果 */
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* 粉蓝渐变边框容器 */
        .frame {
            background: linear-gradient(135deg, #ffb6c1, #87cefa); /* 粉 → 蓝 */
            border-radius: 40px;
            padding: 16px;  /* 这是边框的宽度 */
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
        }

        /* 内部白色内容区 */
        .white-bg {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem;
            text-align: center;
        }

        h2 {
            color: #ff6699;
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .hosts {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            max-width: 1200px;
        }

        .host-card {
            background: #f8f9fc;
            border-radius: 2rem;
            padding: 1.5rem;
            width: 240px;
            text-align: center;
            transition: 0.25s;
            cursor: pointer;
            border: 1px solid #e0e6f0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        }

        .host-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1);
            border-color: #ffb6c1;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #fff0f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 0.8rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .host-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6699;
            margin: 0.5rem 0;
        }

        .team-badge {
            background: #ffb6c1;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fff;
            font-weight: bold;
        }

        .back-home {
            display: inline-block;
            margin-top: 2rem;
            background: none;
            border: 1px solid #ffb6c1;
            color: #ff6699;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-home:hover {
            background: #ffb6c1;
            color: white;
            border-color: #ffb6c1;
        }

        @media (max-width: 700px) {
            .white-bg { padding: 1rem; }
            .host-card { width: 200px; padding: 1rem; }
            .avatar { width: 80px; height: 80px; font-size: 2.5rem; }
            .host-name { font-size: 1.2rem; }
            h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="white-bg">
        <h2>⚔️ 坠猩杯 · 档案馆 ⚔️</h2>
        <div class="hosts">
            <!-- 桃黑黑 -->
            <div class="host-card" onclick="location.href='taoheihei/index.html';">
                <div class="avatar">🍑</div>
                <div class="host-name">桃黑黑</div>
                <div class="team-badge">胖蛋军团</div>
            </div>
            <!-- 中国boy -->
            <div class="host-card" onclick="location.href='zhongguoboy/index.html';">
                <div class="avatar">🦍</div>
                <div class="host-name">中国boy</div>
                <div class="team-badge">猩仔联盟</div>
            </div>
            <!-- 僵尸教授解说 -->
            <div class="host-card" onclick="location.href='jiangshijiaoshou.html';">
                <div class="avatar">🧟‍♂️📖</div>
                <div class="host-name">僵尸教授</div>
                <div class="team-badge">赛事解说</div>
            </div>
        </div>
        <a href="index.html" class="back-home">← 返回首页海报</a>
    </div>
</div>
</body>
</html>
