<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坠猩杯 · 粉丝档案馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            height: 100vh;
            background-image: url('00.jpg');  /* 你的底图 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            cursor: pointer;
        }
        /* 顶部标题栏 - 半透明毛玻璃效果 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 2px solid rgba(255, 111, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .top-bar h1 {
            font-size: 1.8rem;
            color: #ff6f00;
            letter-spacing: 2px;
            text-shadow: 0 0 2px rgba(255,255,200,0.8);
            margin: 0;
        }
        .top-bar .sub {
            font-size: 0.8rem;
            color: #ffb347;
            margin-top: 0.2rem;
        }
        /* 底部点击提示 */
        .enter-hint {
            position: absolute;
            bottom: 8%;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1rem;
            animation: bounce 1.5s infinite;
            text-shadow: 0 0 4px black;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            width: fit-content;
            margin: 0 auto;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 10;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }
        /* 让整个 body 可点击 */
        body {
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .top-bar h1 { font-size: 1.2rem; }
            .enter-hint { font-size: 0.8rem; padding: 0.3rem 1rem; bottom: 5%; }
        }
    </style>
</head>
<body onclick="location.href='host.html';">
    <div class="top-bar">
        <h1>✨ 坠猩杯 · 档案馆 ✨</h1>
        <div class="sub">粉丝自建 · 为热爱而生</div>
    </div>
    <div class="enter-hint">
        ↓ 点击任意处进入 ↓
    </div>
</body>
</html>
